fileVersion: 1
id: "16"
isDisabled: false
metadata:
  defaultStorageLocation: null
  error: null
  nodeMetadataSpec: |-
    capitalized: Hydrated Dimension
    short: DIM
    tagColor: '#1E339A'
    plural: Dimensions
    isColumnResyncEnabled: true

    config:
      
    - groupName: Options
      items:
      - type: materializationSelector
        default: table
        options:
        - table
        - view
        enableIf: 'true'

      - type: multisourceToggle
        enableIf: "{% if node.materializationType == 'table' %} true {% else %} false {% endif %}"
        isRequired: true

      - type: dropdownSelector
        displayName: Multisource Strategy
        attributeName: insertStrategy
        default: INSERT
        options:
        - INSERT
        - UNION
        - UNION ALL
        isRequired: true
        enableIf: 'true'

      - type: businessKeyColumns
        isRequired: true
        enableIf: "true"

      - type: changeTrackingColumns
        isRequired: false
        enableIf: 'true'

      - type: overrideSQLToggle
        enableIf: "{% if node.materializationType == 'view' %} true {% else %} false {% endif %}"

      - displayName: Enable Tests
        attributeName: testsEnabled
        type: toggleButton
        default: true
        
      - displayName: Pre-SQL
        attributeName: preSQL
        type: textBox
        syntax: sql
        isRequired: false

      - displayName: Post-SQL
        attributeName: postSQL
        type: textBox
        syntax: sql
        isRequired: false

    - groupName: Dropdown Selector Example
      items:
      - type: dropdownSelector
        displayName: My Dropdown Selector
        attributeName: myDropdown
        default: option1
        options:
        - option1
        - option2
        isRequired: true
      
      -- - type: toggleButton
      --   displayName: Truncate Before
      --   attributeName: truncateBefore
      --   default: true
      --   enableIf: 'true'

    - groupName: 'Generic Options'
      items:
      - type: toggleButton
        displayName: My Button
        attributeName: myButton
        isRequired: true
        enableIf: 'true'
      
      - type: dropdownSelector
        displayName: My Dropdown Selector
        attributeName: dropdownSelectorExample
        default: option1
        options:
        - option1
        - option2
        isRequired: true
        enableIf: 'true'

      - type: columnDropdownSelector 
        displayName: Column Name
        attributeName: myColumnDropdown
        isRequired: true
        enableIf: 'true'

    - groupName: 'Tabular Config'
      items:
      - type: tabular
        displayName: My Tabular Config
        attributeName: myTabularConfig
        isRequired: false
        enableIf: 'true'

        columns:
        - type: dropdownSelector
          displayName: My Dropdown Selector
          attributeName: tabconfigdropdown
          options:
            - option1
            - option2
          isRequired: false
          enableIf: 'true'

        - type: toggleButton
          displayName: My Toggle Button 2
          attributeName: myToggleButton2
          isRequired: false
          enableIf: 'true'

        - type: columnDropdownSelector 
          displayName: Column Name
          attributeName: myColumnDropdown2
          isRequired: true
          enableIf: 'true'

      - type: textBox
        displayName: My Textbox
        attributeName: myTextbox
        syntax: sql
        isRequired: true
        enableIf: 'true'
      
      - type: columnSelector
        displayName: My Column Selector
        attributeName: myColumnSelector
        isRequired: true
        enableIf: 'true'

    systemColumns:
    - displayName: system_column_name1
      attributeName: isSystemColumnName
      transform: CAST(CURRENT_TIMESTAMP AS TIMESTAMP)
      dataType: STRING
      placement: beginning
      nullable: true
      defaultValue: hello
      description: Some description

    mappingColumns:
    - headerName: '{{NODE_NAME}}_CREATED_BY_COALESCE'
      attributeName: myMappingColumn
      type: textBox
name: Line_item_DIM_Node
type: NodeType
